spring.application.name=serviceflow

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/serviceflow?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:serviceflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:serviceflow}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

serviceflow.jwt.secret=${SERVICEFLOW_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
serviceflow.jwt.expiration=${SERVICEFLOW_JWT_EXPIRATION:PT8H}

serviceflow.cors.allowed-origins=${SERVICEFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173}

serviceflow.mail.enabled=${SERVICEFLOW_MAIL_ENABLED:false}
serviceflow.mail.from=${SERVICEFLOW_MAIL_FROM:no-reply@serviceflow.local}

spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
